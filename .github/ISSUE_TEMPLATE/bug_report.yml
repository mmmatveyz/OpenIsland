name: Баг
description: Что-то работает не так, как ожидалось
title: "[Баг]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт! Чем точнее данные, тем быстрее починим.
        **Уязвимости не сюда** — см. [SECURITY.md](../blob/master/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: Что произошло
      description: Опишите, что вы ожидали и что получилось на самом деле.
      placeholder: "Ожидал: ... Фактически: ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Как воспроизвести проблему с нуля.
      placeholder: |
        1. Запустить OpenIsland.exe
        2. Открыть карточку OpenCode
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия OpenIsland
      description: Видна в настройках острова (последняя строка страницы «Обновление») или в имени скачанного exe.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: "Windows 11 24H2 (сборка 26100)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: |
        Файл `%LOCALAPPDATA%\OpenIsland\logs\app.log`.
        **Не прикладывайте токены** — они не нужны и в логах их быть не должно.
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Скриншоты / видео
      description: Если проблема визуальная — перетащите файл сюда.
    validations:
      required: false
